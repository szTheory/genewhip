  v02-release-qualification:
    if: github.event_name == 'workflow_dispatch' && (inputs.native_diagnostic_case == '' || inputs.native_diagnostic_case == 'none')
    needs: [v02-runtime, v02-benchmark-control, v02-benchmark-recursion94, v02-benchmark-tank-battle, v02-package]
    runs-on: macos-26
    timeout-minutes: 15
    env:
      GENEWHIP_QUALIFICATION_PHASE: package
      GITHUB_BASE_SHA: ${{ inputs.qualification_base_sha }}
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ github.sha }}
      head_sha: ${{ github.sha }}
      base_sha: ${{ inputs.qualification_base_sha || github.event.before || github.sha }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      event_name: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
