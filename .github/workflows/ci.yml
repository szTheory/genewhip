          path: build/v02/package-transfer/payload/artifacts/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Export v0.2 run identity separately from release files
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
