    if: github.event_name == 'workflow_dispatch' && (inputs.native_diagnostic_case == '' || inputs.native_diagnostic_case == 'none')
    needs: [v02-runtime, v02-benchmark-control, v02-benchmark-recursion94, v02-benchmark-tank-battle]
    runs-on: macos-26
    timeout-minutes: 240
    env:
      GENEWHIP_QUALIFICATION_PHASE: package
      GITHUB_BASE_SHA: ${{ inputs.qualification_base_sha }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: ./.github/actions/qualification-clock
        with: {phase: package}
      - name: Download exact runtime attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v02-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: build/v02/runtime-transfer
      - name: Download exact control benchmark attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v02-benchmark-control-${{ github.run_id }}-${{ github.run_attempt }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: build/v02/collected/benchmark-control
      - name: Download exact recursion94 benchmark attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v02-benchmark-recursion94-${{ github.run_id }}-${{ github.run_attempt }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: build/v02/collected/benchmark-recursion94
      - name: Download exact tank-battle benchmark attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v02-benchmark-tank-battle-${{ github.run_id }}-${{ github.run_attempt }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: build/v02/collected/benchmark-tank-battle
      - name: Verify and install the bounded runtime transfer
        run: >-
          python3 -I scripts/release/v02_transfer.py install
          --payload build/v02/runtime-transfer/payload
          --inventory build/v02/runtime-transfer/inventory.json --root .
      - name: Require exact runtime projection before actual package builders
        run: >-
          test -f build/v02/public/manifest.json &&
          python3 -I scripts/evidence/v02_matrix.py verify --public-closure
          --root build/v02/public --independent-roster evidence/v02-roster.json
          --current-execution-identity build/v02/runtime-identity.json
      - name: Run source-bound actual-validator semantic mutants
        run: >-
          python3 -I scripts/release/v02_qualification.py --mode semantic-mutants
          --source-sha "$GITHUB_SHA" --head-sha "$GITHUB_SHA" --base-sha "$GITHUB_BASE_SHA"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --out build/v02/semantic-mutant-receipt.json
      - name: Build and verify exact v0.2 archives and local documentation
        run: >-
          python3 -I scripts/release/v02_qualification.py --mode package
          --public-evidence build/v02/public --out artifacts/v02
      - name: Validate bounded package and dimension transfer before upload
        run: python3 -I scripts/release/v02_transfer.py prepare-package --root . --out build/v02/package-transfer --source-sha "$GITHUB_SHA"
      - name: Bind exact v0.2 release inputs to this workflow run
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/ci/verify_attestation_inputs.py write-identity --directory build/ci-identity
      - name: Export the tested v0.2 release-input bytes
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
