        run: python3 -I scripts/release/v02_transfer.py install-package --payload build/v02/package-transfer/payload --inventory build/v02/package-transfer/inventory.json --root . --source-sha "$GITHUB_SHA"
      - name: Run source-bound actual-validator semantic mutants
        run: >-
          python3 -I scripts/release/v02_qualification.py --mode semantic-mutants
          --source-sha "$GITHUB_SHA" --head-sha "$GITHUB_SHA" --base-sha "$GITHUB_BASE_SHA"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --out build/v02/semantic-mutant-receipt.json
      - name: Validate all exact-source dimension receipts
        run: python3 -I scripts/release/v02_qualification.py --mode validate --evidence build/v02/qualification-dimensions.json --out build/v02/final-close.json
  required-aggregate:
    name: required-ci
    if: always() && github.event_name != 'schedule' && (inputs.native_diagnostic_case == '' || inputs.native_diagnostic_case == 'none')
    needs: [safety, gameplay, desktop, package, performance, product-smoke, phase7-fast, v02-release-qualification, attestation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/qualification-clock
        with: {phase: preparation}
      - name: Verify aggregate source checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Reject incomplete or stale required lanes
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.qualification_base_sha || github.event.before || github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 scripts/ci/aggregate.py
  extended:
    if: github.event_name == 'schedule'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare pinned evidence dependencies
        run: bash scripts/ci/prepare_evidence_dependencies.sh
      - run: bash scripts/ci/extended-gate.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: extended-outcomes
          path: build/extended/reports/
          if-no-files-found: error
          retention-days: 14
