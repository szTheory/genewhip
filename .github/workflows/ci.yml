name: Required preview checks
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      qualification_started_at:
        description: Immutable UTC start from the delivery journal
        required: true
        type: string
      qualification_base_sha:
        description: Public main parent recorded by the delivery journal
        required: true
        type: string
      qualification_nonce:
        description: Unique coordinator dispatch identity
        required: true
        type: string
      native_diagnostic_case:
        description: Fixed non-qualifying native diagnostic
        required: false
        default: none
        type: choice
        options: [none, recursion94-withhold-first-plate, recursion94-native-prefix]
      diagnostic_source_sha:
        description: Exact reviewed source for the fixed native diagnostic
        required: false
        type: string
      native_diagnostic_started_at:
        description: Immutable one-shot dispatch claim UTC start (prefix diagnostic only)
        required: false
        type: string
      native_diagnostic_deadline:
        description: Immutable one-shot dispatch claim UTC deadline (prefix diagnostic only)
        required: false
        type: string
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.native_diagnostic_case == 'recursion94-native-prefix' && format('Plan10 native prefix diagnostic {0}', inputs.qualification_nonce) || github.event_name == 'workflow_dispatch' && inputs.native_diagnostic_case == 'recursion94-withhold-first-plate' && format('Plan10 native diagnostic {0}', inputs.qualification_nonce) || github.event_name == 'workflow_dispatch' && format('Plan10 qualification {0}', inputs.qualification_nonce) || github.workflow }}
permissions:
  contents: read
  actions: read
env:
  # Hosted jobs own their child groups; imported/local tests must opt in.
  GENEWHIP_PROCESS_CONTEXT: host-cleanup-v1
  GENEWHIP_QUALIFICATION_STARTED_AT: ${{ inputs.qualification_started_at }}
  GENEWHIP_QUALIFICATION_NONCE: ${{ inputs.qualification_nonce }}
  GENEWHIP_QUALIFICATION_PHASE: preparation
  GENEWHIP_NATIVE_DIAGNOSTIC_CASE: ${{ inputs.native_diagnostic_case }}
  GENEWHIP_NATIVE_DIAGNOSTIC_SOURCE_SHA: ${{ inputs.diagnostic_source_sha }}
  GENEWHIP_NATIVE_DIAGNOSTIC_STARTED_AT: ${{ inputs.native_diagnostic_started_at }}
  GENEWHIP_NATIVE_DIAGNOSTIC_DEADLINE: ${{ inputs.native_diagnostic_deadline }}
  GITHUB_BASE_SHA: ${{ inputs.qualification_base_sha || github.event.before || github.sha }}
concurrency:
  group: preview-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  safety:
    if: github.event_name != 'schedule' && (inputs.native_diagnostic_case == '' || inputs.native_diagnostic_case == 'none')
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      source_sha: ${{ github.sha }}
      head_sha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      base_sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.qualification_base_sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/qualification-clock
        with: {phase: preparation}
      - name: Verify event integration checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare pinned evidence dependencies
        run: bash scripts/ci/prepare_evidence_dependencies.sh
      - run: bash scripts/ci/required-gate.sh
      - name: Stage validated, sanitized safety evidence
        run: python3 scripts/evidence/phase4_report.py safety-export --build build --out build/safety-export
      - run: cmake -DPROJECT_SOURCE_DIR="$PWD" -P tests/package/package_smoke.cmake
      - name: Stage sanitized safety failure diagnostics
        if: failure()
        run: python3 scripts/evidence/phase4_report.py safety-export --failure-only --build build --out build/safety-failure-export
      - name: Retain safety failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safety-failure-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/safety-failure-export/
          if-no-files-found: warn
          retention-days: 30
      - name: Export exact-source safety evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safety-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/safety-export/
          if-no-files-found: warn
          retention-days: 30
  gameplay:
    if: github.event_name != 'schedule' && (inputs.native_diagnostic_case == '' || inputs.native_diagnostic_case == 'none')
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      source_sha: ${{ github.sha }}
      head_sha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      base_sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.qualification_base_sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/qualification-clock
        with: {phase: preparation}
      - name: Verify event integration checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Build current public clients
        run: |
          cmake -S . -B build/gameplay -DCMAKE_BUILD_TYPE=Release -DGENEWHIP_BUILD_DESKTOP=ON
          cmake --build build/gameplay --parallel 2
      - name: Exercise frozen gameplay cases and both public clients
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: disk
          SDL_AUDIO_DISK_OUTPUT_FILE: build/gameplay/phase4-game-disk.raw
        run: >-
          python3 tests/fixtures/phase4_game.py
          build/gameplay/tools/session/gw_headless
          build/gameplay/tools/desktop/genewhip-desktop
          --report build/gameplay/evidence/phase4-gameplay.json
      - name: Check report and named gameplay mutations
        run: python3 tests/evidence/phase4_report_contract.py
  product-smoke:
    if: github.event_name != 'schedule' && (inputs.native_diagnostic_case == '' || inputs.native_diagnostic_case == 'none')
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      source_sha: ${{ github.sha }}
      head_sha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      base_sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.qualification_base_sha || github.event.before || github.sha }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      event_name: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/qualification-clock
        with: {phase: preparation}
      - name: Verify event integration checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare pinned evidence dependencies
        run: bash scripts/ci/prepare_evidence_dependencies.sh
      - name: Build current public clients
        run: |
          cmake -S . -B build/v02/product-smoke -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DGENEWHIP_BUILD_TOOLS=ON -DGENEWHIP_BUILD_DESKTOP=ON
          cmake --build build/v02/product-smoke --parallel 2
      - name: Run bounded current two-title core and software SDL smoke
        run: >-
          python3 -I scripts/evidence/v02_run.py --mode smoke
          --build build/v02/product-smoke --scope evidence/v02-execution.json
          --out build/v02/product-smoke/smoke.json
  phase7-fast:
    if: github.event_name != 'schedule' && (inputs.native_diagnostic_case == '' || inputs.native_diagnostic_case == 'none')
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      source_sha: ${{ github.sha }}
      head_sha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      base_sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.qualification_base_sha || github.event.before || github.sha }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      event_name: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/qualification-clock
        with: {phase: preparation}
      - name: Verify event integration checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run v0.2 semantic, privacy, rights and delivery controls
        run: bash scripts/ci/required-gate.sh --phase7-fast
  desktop:
    if: github.event_name != 'schedule' && (inputs.native_diagnostic_case == '' || inputs.native_diagnostic_case == 'none')
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      source_sha: ${{ github.sha }}
      head_sha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      base_sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.qualification_base_sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/qualification-clock
        with: {phase: preparation}
      - name: Verify event integration checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare pinned evidence dependencies
        run: bash scripts/ci/prepare_evidence_dependencies.sh
      - name: Build SDL desktop tests
        run: |
          cmake -S . -B build/desktop -DCMAKE_BUILD_TYPE=Release -DGENEWHIP_BUILD_DESKTOP=ON
          cmake --build build/desktop --parallel 2
      - name: Exercise software video, input, audio, pacing and presentation contracts
        run: >-
          ctest --test-dir build/desktop --output-on-failure --no-tests=error
          --output-junit ctest-junit.xml
          -E '^(phase4_host_live|runner_live_display|runner_live_audio)$'
      - name: Reject unapproved CTest skips
        run: python3 scripts/ci/check_ctest_skips.py build/desktop/ctest-junit.xml
      - name: Require native Cocoa and CoreAudio qualification
        env:
          GENEWHIP_LIVE_DISPLAY: '1'
          GENEWHIP_LIVE_AUDIO: '1'
        run: >-
          python3 tests/desktop/phase4_sessions.py live
          --headless build/desktop/tools/session/gw_headless
          --desktop build/desktop/tools/desktop/genewhip-desktop
          --build build/desktop
          --out build/desktop/evidence/phase4-host-live.json
      - name: Export exact-source host session evidence
        run: >-
          python3 scripts/evidence/phase4_report.py host-export
          --build build/desktop --out build/desktop/host-export
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --source-sha "$GITHUB_SHA"
      - name: Upload exact-source host session evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase4-host-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/desktop/host-export/
          if-no-files-found: error
          retention-days: 30
  package:
    if: github.event_name != 'schedule' && (inputs.native_diagnostic_case == '' || inputs.native_diagnostic_case == 'none')
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      GENEWHIP_QUALIFICATION_PHASE: package
    outputs:
      source_sha: ${{ github.sha }}
      head_sha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      base_sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.qualification_base_sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/qualification-clock
        with: {phase: package}
      - name: Verify event integration checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - if: github.event_name != 'workflow_dispatch'
        run: python3 scripts/package_sdk.py
      - if: github.event_name != 'workflow_dispatch'
        run: python3 scripts/package_desktop.py
      - if: github.event_name != 'workflow_dispatch'
        run: python3 tests/package/docs_commands.py --local-artifacts artifacts
      - name: Assemble exact qualified package inventory
        if: github.event_name != 'workflow_dispatch'
        run: >-
          python3 scripts/release/promote.py prepare
          --input-dir artifacts --output-dir build/release-assets --source-sha "$GITHUB_SHA"
      - name: Bind package inputs to this workflow run
        if: github.event_name != 'workflow_dispatch'
        run: python3 scripts/ci/verify_attestation_inputs.py write-identity --directory build/ci-identity
      - name: Export immutable run and attempt scoped package inputs
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/release-assets/*.tar.gz
            build/release-assets/*.tar.gz.sha256
            build/release-assets/*.tar.gz.qualification.json
            build/release-assets/inventory.json
            build/release-assets/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Export run identity separately from release files
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-identity/_ci-identity.json
          if-no-files-found: error
          retention-days: 30
      - name: Use qualified v0.2 release inputs on dispatch
        if: github.event_name == 'workflow_dispatch'
        run: test -n "$GITHUB_SHA"
  attestation:
    name: attestation
    if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.package.result == 'success') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.package.result == 'success' && needs.v02-release-qualification.result == 'success')) && (inputs.native_diagnostic_case == '' || inputs.native_diagnostic_case == 'none')
    needs: [package, v02-package, v02-release-qualification]
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    env:
      GENEWHIP_QUALIFICATION_PHASE: package
    outputs:
      source_sha: ${{ github.sha }}
      head_sha: ${{ github.sha }}
      base_sha: ${{ inputs.qualification_base_sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/qualification-clock
        with: {phase: package}
      - name: Download immutable package data from this run attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release-assets
      - name: Download matching run identity from this attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-identity
      - name: Verify run identity, source and exact inventory before attesting
        run: >-
          python3 scripts/ci/verify_attestation_inputs.py verify
          --directory build/release-assets --identity-directory build/ci-identity
      - name: Attest exact package archives and inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'build/release-assets/*.tar.gz,build/release-assets/inventory.json'
  performance:
    if: github.event_name != 'schedule' && (inputs.native_diagnostic_case == '' || inputs.native_diagnostic_case == 'none')
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      source_sha: ${{ github.sha }}
      head_sha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      base_sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.qualification_base_sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/qualification-clock
        with: {phase: preparation}
      - name: Verify event integration checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Build optimized benchmark with private accounting hooks
        run: |
          cmake -S . -B build/performance -DCMAKE_BUILD_TYPE=Release -DGENEWHIP_TEST_HOOKS=ON
          cmake --build build/performance --target gw_core_benchmark --parallel 2
      - name: Require measurement and output contract; keep timings informational
        run: python3 tests/evidence/benchmark_contract.py --build build/performance
      - name: Save bounded timing sample without a release threshold
        run: >-
          python3 tools/evidence/core_benchmark.py --build build/performance
          --out build/performance/ci-quick-report.json --quick
  v02-runtime:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: ${{ (inputs.native_diagnostic_case == 'recursion94-withhold-first-plate' || inputs.native_diagnostic_case == 'recursion94-native-prefix') && 45 || 360 }}
    env:
      GENEWHIP_QUALIFICATION_PHASE: runtime
      GITHUB_BASE_SHA: ${{ inputs.qualification_base_sha }}
    outputs:
      source_sha: ${{ github.sha }}
      head_sha: ${{ github.sha }}
      base_sha: ${{ inputs.qualification_base_sha || github.event.before || github.sha }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/qualification-clock
        with: {phase: runtime}
      - name: Verify exact source checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Reject unsupported diagnostic selectors before setup
        run: >-
          python3 -I -c 'import os; value=os.environ.get("GENEWHIP_NATIVE_DIAGNOSTIC_CASE", "");
          assert value in ("", "none", "recursion94-withhold-first-plate", "recursion94-native-prefix"), "native-diagnostic-selector-invalid"'
      - name: Require the reviewed diagnostic source before setup
        if: inputs.native_diagnostic_case == 'recursion94-withhold-first-plate'
        run: test "$GITHUB_SHA" = "$GENEWHIP_NATIVE_DIAGNOSTIC_SOURCE_SHA"
      - name: Require the reviewed native prefix source before setup
        if: inputs.native_diagnostic_case == 'recursion94-native-prefix'
        run: test "$GITHUB_SHA" = "$GENEWHIP_NATIVE_DIAGNOSTIC_SOURCE_SHA"
      - name: Validate immutable native prefix deadline before setup
        if: inputs.native_diagnostic_case == 'recursion94-native-prefix' && (inputs.native_diagnostic_started_at != '' || inputs.native_diagnostic_deadline != '')
        run: >-
          python3 -I -c 'import datetime, os; p=lambda n: datetime.datetime.fromisoformat(os.environ[n].replace("Z", "+00:00")); s=p("GENEWHIP_NATIVE_DIAGNOSTIC_STARTED_AT"); d=p("GENEWHIP_NATIVE_DIAGNOSTIC_DEADLINE"); q=p("GENEWHIP_QUALIFICATION_STARTED_AT"); now=datetime.datetime.now(datetime.timezone.utc); assert s.tzinfo and d.tzinfo and q == s and d == s + datetime.timedelta(seconds=2700) and datetime.timedelta(0) <= now-s < datetime.timedelta(seconds=2700), "native-prefix-claim-clock-invalid"'
      - name: Prepare pinned evidence dependencies
        run: bash scripts/ci/prepare_evidence_dependencies.sh
      - name: Build identified debug clients and safety roster
        run: |
          mkdir -p build/v02
          cmake -S . -B build/v02/runtime-build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DGENEWHIP_BUILD_TOOLS=ON -DGENEWHIP_BUILD_DESKTOP=ON -DGENEWHIP_TEST_HOOKS=ON
          cmake --build build/v02/runtime-build --parallel 2
      - name: Run complete current-source product safety and chunk roster
        if: inputs.native_diagnostic_case != 'recursion94-withhold-first-plate' && inputs.native_diagnostic_case != 'recursion94-native-prefix'
        run: >-
          python3 -I scripts/release/v02_qualification.py --mode runtime
          --build build/v02/runtime-build --scope evidence/v02-execution.json
          --out build/v02/runtime-observation.json
      - name: Diagnose one native case without qualification
        if: inputs.native_diagnostic_case == 'recursion94-withhold-first-plate'
        run: >-
          python3 -I scripts/release/v02_qualification.py --mode native-diagnostic
          --build build/v02/runtime-build --scope evidence/v02-execution.json
          --out build/v02/native-diagnostic.json
      - name: Diagnose the fixed native prefix without qualification
        if: inputs.native_diagnostic_case == 'recursion94-native-prefix'
        run: >-
          python3 -I scripts/release/v02_qualification.py --mode native-prefix-diagnostic
          --build build/v02/runtime-build --scope evidence/v02-execution.json
          --out build/v02/native-prefix-diagnostic.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.native_diagnostic_case != 'recursion94-withhold-first-plate' && inputs.native_diagnostic_case != 'recursion94-native-prefix'
        with:
          name: v02-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/v02/runtime-transfer/payload/build/v02/**
            build/v02/runtime-transfer/inventory.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain sanitized diagnostic on success or failure
        if: always() && inputs.native_diagnostic_case == 'recursion94-withhold-first-plate'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-case-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/v02/native-diagnostic.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain sanitized native prefix diagnostic on success or failure
        if: always() && inputs.native_diagnostic_case == 'recursion94-native-prefix'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-prefix-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/v02/native-prefix-diagnostic.json
          if-no-files-found: error
          retention-days: 30
  v02-benchmark-control:
    # Explicit needs chain below keeps all three workload benchmarks serial (max-parallel: 1).
    if: github.event_name == 'workflow_dispatch' && (inputs.native_diagnostic_case == '' || inputs.native_diagnostic_case == 'none')
    needs: [v02-runtime]
    runs-on: macos-26
    timeout-minutes: 240
    env:
      GENEWHIP_QUALIFICATION_PHASE: runtime
      GITHUB_BASE_SHA: ${{ inputs.qualification_base_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: ./.github/actions/qualification-clock
        with: {phase: runtime}
      - name: Verify exact benchmark source checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
