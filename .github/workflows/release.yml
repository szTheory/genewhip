name: Promote qualified preview release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful trusted main-branch Required preview checks run ID
        required: true
        type: string
      run_attempt:
        description: Exact successful run attempt that created the package artifact
        required: true
        type: number
      source_sha:
        description: Full source commit SHA reported by that run
        required: true
        type: string
permissions: {}
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: genewhip-release-${{ github.repository }}
      queue: max
    # The publisher reads effective branch rules; no Administration permission is needed.
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Check out trusted default-branch publisher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Assert publisher code came from the protected default branch
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Download only the selected successful run attempt's immutable package artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-input-${{ inputs.run_id }}-${{ inputs.run_attempt }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-assets
      - name: Verify provenance and stage the complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUN_ID: ${{ inputs.run_id }}
          RUN_ATTEMPT: ${{ inputs.run_attempt }}
          EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: >-
          python3 scripts/release/promote.py publish
          --repository "$REPOSITORY"
          --source-sha "$SOURCE_SHA"
          --run-id "$RUN_ID"
          --run-attempt "$RUN_ATTEMPT"
          --event "$EVENT_PATH"
          --asset-dir release-assets
