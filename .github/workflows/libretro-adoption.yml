name: Verify downloaded Linux Libretro release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published Linux Libretro prerelease tag
        required: true
        type: choice
        options: [v0.3.0, v0.3.1]
      source_sha:
        description: Exact source commit used to build the release
        required: true
        type: string
      run_id:
        description: Successful trusted main push CI run that built the release
        required: true
        type: string
      run_attempt:
        description: Exact successful CI run attempt
        required: true
        type: number
permissions:
  contents: read
  actions: read
  attestations: read
jobs:
  adopt:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact downloaded release bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUN_ID: ${{ inputs.run_id }}
          RUN_ATTEMPT: ${{ inputs.run_attempt }}
        run: |
          case "$RELEASE_TAG" in
            v0.3.0) VERSION=0.3.0 ;;
            v0.3.1) VERSION=0.3.1 ;;
            *) echo "Unsupported release tag" >&2; exit 2 ;;
          esac
          python3 -I scripts/release/qualify_delivery.py \
            --verify --download-only \
            --version "$VERSION" --release-tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" --source-sha "$SOURCE_SHA" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --download-dir build/phase9/downloaded-release \
            --evidence-out build/phase9/downloaded-release-evidence.json
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          path: build/phase9/source
          persist-credentials: false
      - name: Run downloaded module ABI smoke without credentials
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUN_ID: ${{ inputs.run_id }}
          RUN_ATTEMPT: ${{ inputs.run_attempt }}
        run: |
          case "$RELEASE_TAG" in
            v0.3.0) VERSION=0.3.0 ;;
            v0.3.1) VERSION=0.3.1 ;;
            *) echo "Unsupported release tag" >&2; exit 2 ;;
          esac
          python3 -I scripts/release/qualify_delivery.py \
            --adopt-verified \
            --version "$VERSION" --release-tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" --source-sha "$SOURCE_SHA" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --download-dir build/phase9/downloaded-release \
            --evidence build/phase9/downloaded-release-evidence.json \
            --source-tree build/phase9/source \
            --evidence-out build/phase9/libretro-adoption.json
      - name: Upload bounded sanitized adoption receipt
        if: always() && hashFiles('build/phase9/libretro-adoption.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libretro-adoption-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/phase9/libretro-adoption.json
          if-no-files-found: error
          retention-days: 30
